<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#073047" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/assets/pwa/icon-192.png" />
    <link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml" />
    <title data-auth-title-base="Forgot password">Forgot password — Locus</title>
    <script src="js/config-override.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app-themes.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/auth-page.css" />
</head>
<body class="auth-page auth-page--onecallaccess">
    <script src="js/auth-branding.js"></script>
    <div class="onecall-access">
        <div class="onecall-access__bg" aria-hidden="true"></div>
        <div class="onecall-panel">
            <header class="onecall-panel__brand">
                <div class="onecall-panel__brand-lines" aria-hidden="true"></div>
                <div class="onecall-panel__logo-wrap">
                    <img class="onecall-panel__logo" data-auth-brand="logo-img" src="assets/logo-mark.svg" width="40" height="40" alt="Locus" decoding="async" />
                    <span class="onecall-panel__logo-word" data-auth-brand="logo-word">LOCUS</span>
                </div>
                <p class="onecall-panel__tagline" data-auth-brand="tagline" hidden></p>
            </header>
            <div class="onecall-panel__body">
                <h1 class="onecall-panel__title">Forgot password</h1>
                <p class="login-help-text" data-auth-brand="forgot-hint">Enter the email on your account.</p>

                <div class="error-message" id="messageBox"></div>

                <form class="login-form" id="forgotPasswordForm">
                    <div class="onecall-field">
                        <label class="form-label" for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            class="form-input"
                            placeholder="Enter your email"
                            required
                            autocomplete="email"
                        />
                    </div>

                    <button type="submit" class="login-button" id="submitButton">
                        Send reset link
                    </button>
                </form>

                <div class="forgot-password">
                    <a href="login.html">Back to log in</a>
                </div>
            </div>
        </div>
        <p class="onecall-powered">Powered by <strong data-auth-brand="powered-name">Locus</strong></p>
    </div>

    <script src="js/auth-onecall-ui.js"></script>
    <script src="js/app-login.bundle.js"></script>
    <script>
        const form = document.getElementById('forgotPasswordForm');
        const emailInput = document.getElementById('email');
        const submitButton = document.getElementById('submitButton');
        const messageBox = document.getElementById('messageBox');

        function showMessage(message, success) {
            messageBox.textContent = message;
            messageBox.classList.toggle('success', !!success);
            messageBox.classList.add('show');
        }

        let cooldownTimer = null;

        function stopResetCooldown() {
            if (cooldownTimer) {
                clearInterval(cooldownTimer);
                cooldownTimer = null;
            }
        }

        function beginResetCooldown() {
            stopResetCooldown();
            const until = Date.now() + 60000;
            const tick = function () {
                const left = Math.ceil((until - Date.now()) / 1000);
                if (left <= 0) {
                    stopResetCooldown();
                    submitButton.disabled = false;
                    submitButton.textContent = 'Send reset link';
                    return;
                }
                submitButton.disabled = true;
                submitButton.textContent = 'Check your email (' + left + 's)';
            };
            tick();
            cooldownTimer = setInterval(tick, 250);
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            if (submitButton.disabled) return;
            messageBox.classList.remove('show', 'success');

            const email = emailInput.value.trim();
            if (!email) {
                showMessage('Please enter your email address.', false);
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = 'Sending…';

            const result = await window.authModule.requestPasswordReset(email);
            if (result.success) {
                showMessage(
                    (result.message || 'If an account exists for that email, we sent a password reset link.') +
                        ' Check your email. You can request another link in a minute.',
                    true
                );
                beginResetCooldown();
            } else {
                showMessage(result.error || 'Unable to request password reset.', false);
                submitButton.disabled = false;
                submitButton.textContent = 'Send reset link';
            }
        });
    </script>
</body>
</html>
