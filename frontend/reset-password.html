<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#073047" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/assets/pwa/icon-192.png" />
    <link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml" />
    <title data-auth-title-base="Reset password">Reset password — Locus</title>
    <script src="js/config-override.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app-themes.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/auth-page.css" />
</head>
<body class="auth-page auth-page--onecallaccess">
    <script src="js/auth-branding.js"></script>
    <div class="onecall-access">
        <div class="onecall-access__bg" aria-hidden="true"></div>
        <div class="onecall-panel">
            <header class="onecall-panel__brand">
                <div class="onecall-panel__brand-lines" aria-hidden="true"></div>
                <div class="onecall-panel__logo-wrap">
                    <img class="onecall-panel__logo" data-auth-brand="logo-img" src="assets/logo-mark.svg" width="40" height="40" alt="Locus" decoding="async" />
                    <span class="onecall-panel__logo-word" data-auth-brand="logo-word">LOCUS</span>
                </div>
                <p class="onecall-panel__tagline" data-auth-brand="tagline" hidden></p>
            </header>
            <div class="onecall-panel__body">
                <h1 class="onecall-panel__title">Reset password</h1>
                <p class="login-help-text">Your reset link is valid for 15 minutes.</p>

                <div class="error-message" id="messageBox"></div>

                <form class="login-form" id="resetPasswordForm">
                    <div class="onecall-field">
                        <label class="form-label" for="password">New password</label>
                        <div class="onecall-password-wrap">
                            <input
                                type="password"
                                id="password"
                                class="form-input"
                                placeholder="Enter a new password"
                                required
                                minlength="8"
                                autocomplete="new-password"
                            />
                            <button
                                type="button"
                                class="onecall-password-toggle"
                                data-onecall-password-toggle
                                aria-controls="password"
                                aria-pressed="false"
                                aria-label="Show password"
                            >Show</button>
                        </div>
                        <small class="login-help-text login-help-text--muted" style="font-size: 0.75rem; margin-top: 0.35rem; display: block;">At least 8 characters, with one number and one special character.</small>
                    </div>

                    <div class="onecall-field">
                        <label class="form-label" for="confirmPassword">Confirm password</label>
                        <div class="onecall-password-wrap">
                            <input
                                type="password"
                                id="confirmPassword"
                                class="form-input"
                                placeholder="Confirm your new password"
                                required
                                minlength="8"
                                autocomplete="new-password"
                            />
                            <button
                                type="button"
                                class="onecall-password-toggle"
                                data-onecall-password-toggle
                                aria-controls="confirmPassword"
                                aria-pressed="false"
                                aria-label="Show password"
                            >Show</button>
                        </div>
                    </div>

                    <button type="submit" class="login-button" id="submitButton">
                        Reset password
                    </button>
                </form>

                <div class="forgot-password">
                    <a href="login.html">Back to log in</a>
                </div>
            </div>
        </div>
        <p class="onecall-powered">Powered by <strong data-auth-brand="powered-name">Locus</strong></p>
    </div>

    <script src="js/auth-onecall-ui.js"></script>
    <script src="js/app-login.bundle.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || '';
        const form = document.getElementById('resetPasswordForm');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const submitButton = document.getElementById('submitButton');
        const messageBox = document.getElementById('messageBox');

        function showMessage(message, success) {
            messageBox.textContent = message;
            messageBox.classList.toggle('success', !!success);
            messageBox.classList.add('show');
        }

        if (!token) {
            submitButton.disabled = true;
            showMessage('This password reset link is missing a token. Please request a new link.', false);
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            messageBox.classList.remove('show', 'success');

            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const policy = window.validatePasswordPolicy
                ? window.validatePasswordPolicy(password)
                : { ok: true };
            if (!policy.ok) {
                showMessage(policy.error || window.PASSWORD_POLICY_MESSAGE, false);
                return;
            }
            if (password !== confirmPassword) {
                showMessage('Passwords do not match.', false);
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = 'Resetting…';

            const result = await window.authModule.resetPassword(token, password);
            if (result.success) {
                localStorage.removeItem('authToken');
                localStorage.removeItem('currentUser');
                sessionStorage.removeItem('userGreeting');
                showMessage('Password reset successfully. You can now sign in.', true);
                setTimeout(function () {
                    window.location.href = 'login.html';
                }, 1600);
            } else {
                showMessage(result.error || 'Unable to reset password.', false);
                submitButton.disabled = false;
                submitButton.textContent = 'Reset password';
            }
        });
    </script>
</body>
</html>
